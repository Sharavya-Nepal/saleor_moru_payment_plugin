fragment TransactionCancelationRequestedPayload on TransactionCancelationRequested {
  action {
    amount
    currency
    actionType
  }
  transaction {
    id
    pspReference
    canceledAmount {
      amount
      currency
    }
  }
}

subscription TransactionCancelationRequested {
  event {
    ...TransactionCancelationRequestedPayload
  }
}
