fragment TransactionRefundRequestedPayload on TransactionRefundRequested {
  action {
    amount
    currency
    actionType
  }
  transaction {
    id
    pspReference
    refundedAmount {
      amount
      currency
    }
  }
  grantedRefund {
    id
    amount {
      amount
      currency
    }
  }
}

subscription TransactionRefundRequested {
  event {
    ...TransactionRefundRequestedPayload
  }
}
